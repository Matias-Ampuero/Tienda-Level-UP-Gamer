<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Level-Up Gamer</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../Css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-controller me-2"></i>Level-Up Gamer
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html">Blogs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item dropdown me-2">
                        <a class="nav-link dropdown-toggle" href="#" id="authDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>Mi Cuenta
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="login.html"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a></li>
                            <li><a class="dropdown-item" href="registro.html"><i class="bi bi-person-plus me-2"></i>Registro</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-warning" href="admin/index.html"><i class="bi bi-gear me-2"></i>Panel Administrativo</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-gamer position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                            <i class="bi bi-cart3 me-2"></i>Carrito
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge" id="cartCount">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Productos Section -->
    <section class="py-5" style="margin-top: 80px;">
        <div class="container">
            <h2 class="text-center mb-5">
                <i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Catálogo de Productos
            </h2>
            
            <!-- Filtros -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <select class="form-select" id="categoryFilter" onchange="filterProducts()">
                        <option value="">Todas las Categorías</option>
                        <option value="Juegos de Mesa">Juegos de Mesa</option>
                        <option value="Accesorios">Accesorios</option>
                        <option value="Consolas">Consolas</option>
                        <option value="Computadores Gamers">Computadores Gamers</option>
                        <option value="Sillas Gamers">Sillas Gamers</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Mousepad">Mousepad</option>
                        <option value="Poleras Personalizadas">Poleras Personalizadas</option>
                        <option value="Polerones Gamers Personalizados">Polerones Gamers Personalizados</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar productos..." onkeyup="searchProducts()">
                </div>
            </div>
            
            <!-- Productos Grid -->
            <div class="row" id="productsGrid">
                <!-- Los productos se cargarán dinámicamente -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-custom py-4">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="text-secondary mb-0">&copy; 2024 Level-Up Gamer. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background: #1a1a1a; color: white;">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">
                        <i class="bi bi-cart3 me-2"></i>Carrito de Compras
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartContent">
                        <!-- Los items del carrito se cargarán dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/cart.js"></script>
    <script src="../js/products.js"></script>
</body>
</html>
