<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Level-Up Gamer</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../Css/style.css">
    <link rel="stylesheet" href="../../Css/admin.css">
</head>
<body class="admin-body">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h4 class="text-white">
                <i class="bi bi-controller me-2"></i>Level-Up Gamer
            </h4>
            <small class="text-muted">Panel Administrativo</small>
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="index.html" class="menu-link">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="menu-item">
                <a href="../productos.html" class="menu-link">
                    <i class="bi bi-box-seam me-2"></i>Productos
                </a>
            </li>
            <li class="menu-item active">
                <a href="usuarios.html" class="menu-link">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link">
                    <i class="bi bi-graph-up me-2"></i>Reportes
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link">
                    <i class="bi bi-cart-check me-2"></i>Pedidos
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link">
                    <i class="bi bi-gear me-2"></i>Configuración
                </a>
            </li>
        </ul>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="bi bi-person-circle me-2"></i>
                <span>Administrador</span>
            </div>
            <a href="../index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Salir
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="admin-header">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="admin-title">
                    <i class="bi bi-people me-2"></i>Usuarios
                </h1>
                <div class="header-actions">
                    <button class="btn btn-gamer" data-bs-toggle="modal" data-bs-target="#nuevoUsuarioModal">
                        <i class="bi bi-person-plus me-1"></i>NUEVO USUARIO
                    </button>
                </div>
            </div>
        </header>

        <!-- Users Content -->
        <div class="admin-content">
            <!-- Search and Filters -->
            <div class="row mb-4">
                <div class="col-lg-6">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control" placeholder="Buscar usuarios..." id="searchUsers">
                    </div>
                </div>
                <div class="col-lg-3">
                    <select class="form-select" id="filterStatus">
                        <option value="">Todos los estados</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                        <option value="pendiente">Pendiente</option>
                    </select>
                </div>
                <div class="col-lg-3">
                    <select class="form-select" id="filterRegion">
                        <option value="">Todas las regiones</option>
                        <option value="Metropolitana">Metropolitana</option>
                        <option value="Valparaíso">Valparaíso</option>
                        <option value="Biobío">Biobío</option>
                        <option value="Ñuble">Ñuble</option>
                    </select>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-responsive">
                <table class="table table-dark table-hover" id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Región</th>
                            <th>Estado</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Los usuarios se cargarán aquí con JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav aria-label="Paginación de usuarios">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- La paginación se generará con JavaScript -->
                </ul>
            </nav>
        </div>
    </main>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="nuevoUsuarioModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h5 class="modal-title text-white">
                        <i class="bi bi-person-plus me-2"></i>NUEVO USUARIO
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="nuevoUsuarioForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombreCompleto" class="form-label text-white">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombreCompleto" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label text-white">Correo</label>
                                <input type="email" class="form-control" id="correo" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label text-white">Teléfono (opcional)</label>
                                <input type="tel" class="form-control" id="telefono">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaNacimiento" class="form-label text-white">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="region" class="form-label text-white">Seleccione la región</label>
                                <select class="form-select" id="region" required>
                                    <option value="">Seleccione una región</option>
                                    <option value="Metropolitana">Región Metropolitana de Santiago</option>
                                    <option value="Valparaíso">Región de Valparaíso</option>
                                    <option value="Biobío">Región del Biobío</option>
                                    <option value="Ñuble">Región de Ñuble</option>
                                    <option value="Araucanía">Región de La Araucanía</option>
                                    <option value="Los Lagos">Región de Los Lagos</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="comuna" class="form-label text-white">Seleccione la comuna</label>
                                <select class="form-select" id="comuna" required>
                                    <option value="">Seleccione una comuna</option>
                                    <option value="Santiago">Santiago</option>
                                    <option value="Valparaíso">Valparaíso</option>
                                    <option value="Concepción">Concepción</option>
                                    <option value="Chillán">Chillán</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label text-white">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label text-white">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-gamer" onclick="crearUsuario()">
                        <i class="bi bi-check-lg me-1"></i>REGISTRAR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../../js/admin.js"></script>
    <script src="../../js/admin-users.js"></script>
</body>
</html>
